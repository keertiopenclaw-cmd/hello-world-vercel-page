<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hi Keerti</title>
  <meta name="description" content="A simple personal hello page.">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f7f4ef" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1c1917" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f7f4ef;
      --ink: #1c1917;
      --muted: #57534e;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1c1917;
        --ink: #f5f5f4;
        --muted: #d6d3d1;
      }
    }

    * {
      box-sizing: border-box;
    }

    html {
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: Georgia, "Iowan Old Style", "Palatino Linotype", Palatino, serif;
      line-height: 1.5;
    }

    main {
      max-width: 36rem;
      margin: 0 auto;
      padding: 4.5rem 1.5rem 3rem;
    }

    .label {
      margin: 0 0 1rem;
      color: var(--muted);
      font-family: ui-sans-serif, system-ui, sans-serif;
      font-size: 0.9375rem;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.25rem, 8vw, 3.25rem);
      font-weight: 500;
      letter-spacing: -0.02em;
      line-height: 1.15;
    }

    .note {
      margin: 1rem 0 0;
      font-size: 1.125rem;
    }
  </style>
</head>
<body>
  <main>
    <p class="label">A simple personal page</p>
    <h1>hi Keerti</h1>
    <p class="note">This page was updated by OpenClaw.</p>
  </main>
</body>
</html>
